<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exberks 的技术笔记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7f9;
    color: #1f2328;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  header p {
    margin-top: 8px;
    color: #656d76;
    font-size: 14px;
  }
  h2.course {
    margin-top: 40px;
    font-size: 18px;
    font-weight: 650;
  }
  .timeline {
    margin-top: 24px;
    position: relative;
    padding-left: 32px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 10px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: #d8dee4;
  }
  .timeline-item { position: relative; padding-bottom: 32px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-dot {
    position: absolute;
    left: -32px;
    top: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #0969da;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    z-index: 1;
  }
  .item-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .item-title { font-size: 16px; font-weight: 600; }
  .item-title a { color: #0969da; text-decoration: none; }
  .item-title a:hover { text-decoration: underline; color: #0550ae; }
  .item-date { font-size: 12px; color: #8b949e; white-space: nowrap; }
  .item-desc { margin-top: 6px; font-size: 13.5px; color: #656d76; line-height: 1.6; }
  .item-tags { margin-top: 8px; font-size: 12px; color: #656d76; }
  .item-tags code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: #0550ae;
    background: #ddf4ff;
    border: 1px solid #54aeff66;
    border-radius: 0;
    padding: 1px 6px;
    margin: 0 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Exberks的技术笔记</h1>
    <p>课程笔记目录 · 持续更新</p>
  </header>
  <h2 class="course">生成式软件工程</h2>
  <main class="timeline">
    <div class="timeline-item">
      <div class="timeline-dot">2</div>
      <div class="item-header">
        <h3 class="item-title"><a href="jyy-vibecoding-course-note/lec2-note/">提示词与上下文工程</a></h3>
        <span class="item-date">2026-09-04</span>
      </div>
      <p class="item-desc">八层上下文、注意力流动、算力换智力、verify 循环等。</p>
      <div class="item-tags">tag: <code>jyy-vibe-coding</code>, <code>lec2</code></div>
    </div>
    <div class="timeline-item">
      <div class="timeline-dot">3</div>
      <div class="item-header">
        <h3 class="item-title"><a href="jyy-vibecoding-course-note/lec3-note/">软件仓库管理</a></h3>
        <span class="item-date">2026-09-17</span>
      </div>
      <p class="item-desc">Git 本质、commit、best practice、Hooks、Agent 协作。</p>
      <div class="item-tags">tag: <code>jyy-vibe-coding</code>, <code>lec3</code></div>
    </div>
  </main>
</div>
<script>
/* 本地 file:// 预览时把标题链接从目录形式改写为 index.html；线上 https 保持目录链接，URL 不带文件名 */
if(location.protocol==='file:'){[].forEach.call(document.querySelectorAll('.item-title a'),function(a){
  var h=a.getAttribute('href');if(/\/$/.test(h))a.setAttribute('href',h+'index.html');});}
</script>
</body>
</html>
