<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXHBM · 文章目录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7f9;
    color: #1f2328;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  header p {
    margin-top: 8px;
    color: #656d76;
    font-size: 14px;
  }
  .list {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.card {
    display: block;
    background: #ffffff;
    border: 1px solid #d8dee4;
    border-radius: 10px;
    padding: 18px 22px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  a.card:hover {
    box-shadow: 0 4px 14px rgba(31, 35, 40, 0.10);
    transform: translateY(-1px);
  }
  .card h2 {
    font-size: 17px;
    font-weight: 600;
    color: #0969da;
  }
  .card p {
    margin-top: 6px;
    font-size: 13.5px;
    color: #656d76;
    line-height: 1.6;
  }
  .card .date {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    color: #8b949e;
  }
  footer {
    margin-top: 48px;
    font-size: 12.5px;
    color: #8b949e;
  }
  footer a { color: #0969da; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EXHBM 的文章</h1>
    <p>文章目录 · 持续更新</p>
  </header>
  <main class="list">
    <a class="card" href="%E6%8F%90%E7%A4%BA%E8%AF%8D%E4%B8%8E%E4%B8%8A%E4%B8%8B%E6%96%87%E5%B7%A5%E7%A8%8B-%E9%95%BF%E6%96%87%E7%89%88.html">
      <h2>提示词与上下文工程（长文版）</h2>
      <p>从提示词基础到上下文工程的系统性长文讲解。</p>
      <span class="date">2026-09-04</span>
    </a>
  </main>
  <footer>
    <a href="https://github.com/EXHBM/EXHBM.github.io">GitHub 仓库</a>
  </footer>
</div>
</body>
</html>
