<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古代文学3 课程实录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7f9;
    color: #1f2328;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  header p {
    margin-top: 8px;
    color: #656d76;
    font-size: 14px;
  }
  h2.course {
    margin-top: 40px;
    font-size: 18px;
    font-weight: 650;
  }
  .timeline {
    margin-top: 24px;
    position: relative;
    padding-left: 32px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 10px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: #d8dee4;
  }
  .timeline-item { position: relative; padding-bottom: 32px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-dot {
    position: absolute;
    left: -32px;
    top: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #0969da;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    z-index: 1;
  }
  .item-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .item-title { font-size: 16px; font-weight: 600; }
  .item-title a { color: #0969da; text-decoration: none; }
  .item-title a:hover { text-decoration: underline; color: #0550ae; }
  .item-date { font-size: 12px; color: #8b949e; white-space: nowrap; }
  .item-desc { margin-top: 6px; font-size: 13.5px; color: #656d76; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>古代文学3 课程实录</h1>
    <p>隋唐五代文学 · 课堂实录</p>
  </header>
  <h2 class="course">课程实录</h2>
  <main class="timeline">
    <div class="timeline-item">
      <div class="timeline-dot">1</div>
      <div class="item-header">
        <h3 class="item-title"><a href="lec1-note/">第一课</a></h3>
        <span class="item-date">2026-09-16</span>
      </div>
      <p class="item-desc">隋唐大一统与唐代文学繁荣的原因、表现，及隋与初唐诗歌。</p>
    </div>
    <div class="timeline-item">
      <div class="timeline-dot">2</div>
      <div class="item-header">
        <h3 class="item-title"><a href="lec2-note/">第二课</a></h3>
        <span class="item-date">2026-09-18</span>
      </div>
      <p class="item-desc">律诗格律（回忌声病、约句准篇、严对偶）与初唐四杰。</p>
    </div>
  </main>
</div>
<script>
/* 本地 file:// 预览时把标题链接从目录形式改写为 index.html；线上 https 保持目录链接，URL 不带文件名 */
if(location.protocol==='file:'){[].forEach.call(document.querySelectorAll('.item-title a'),function(a){
  var h=a.getAttribute('href');if(/\/$/.test(h))a.setAttribute('href',h+'index.html');});}
</script>
</body>
</html>
